name: Build & Test
on:
  push:
  pull_request:
  schedule:
    - cron:  '0 7 * * MON'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Prevent workflow from running twice when push to PR from main repo, maintains workflow run when PR from forked repo
    # if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        java-version: [21]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      # This step should soon be unnecessary: https://github.com/actions/runner-images/issues/11093
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # - name: Restore m2 cache # Only trigger on feature branch
      #   if: github.ref != 'refs/heads/develop'
      #   uses: actions/cache/restore@v4
      #   with:
      #     key: ${{ matrix.os }}-maven-m2- # This lookup will fail, the restore-keys entry will be used, falling back on the most recent cache
      #     path: ~/.m2/repository
      #     restore-keys: ${{ matrix.os }}-maven-m2-

      - name: Build & Test
        shell: bash
        run: releng/build_and_test.sh --ci #--parallel

      # - name: Save m2 cache # Only trigger on develop unscheduled
      #   if: github.ref == 'refs/heads/develop' && github.event.schedule != '0 7 * * MON'
      #   uses: actions/cache/save@v4
      #   with:
      #     path: ~/.m2/repository
      #     key: ${{ matrix.os }}-maven-m2-${{ github.run_id }}

      - name: Analyze with SONAR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -X -B -e -c -Dtycho.mode=maven jacoco:report -Djacoco.dataFile=../../target/jacoco.exec -Dsonar.projectKey=preesm_preesm -Dsonar.token=$SONAR_TOKEN sonar:sonar

      - name: Archive Linux product
        uses: actions/upload-artifact@v4
        with:
          name: linux-products
          path: releng/org.preesm.product/target/products/preesm-*-linux.gtk.x86_64.zip

      - name: Archive macOS aarch64 product
        uses: actions/upload-artifact@v4
        with:
          name: mac-aarch64-products
          path: releng/org.preesm.product/target/products/preesm-*-macosx.cocoa.aarch64.zip

      - name: Archive macOS x86_64 product
        uses: actions/upload-artifact@v4
        with:
          name: mac-x86-products
          path: releng/org.preesm.product/target/products/preesm-*-macosx.cocoa.x86_64.zip

      - name: Archive Windows product
        uses: actions/upload-artifact@v4
        with:
          name: windows-products
          path: releng/org.preesm.product/target/products/preesm-*-win32.win32.x86_64.zip

      - name: Generate changelog
        if: github.ref == 'refs/heads/develop' && github.event.schedule != '0 7 * * MON'
        shell: bash
        run: git log $(git describe --tags --abbrev=0)..HEAD --oneline --no-decorate > dev-changelog.txt

      - name: Upload changelog
        if: github.ref == 'refs/heads/develop' && github.event.schedule != '0 7 * * MON'
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: dev-changelog.txt

  compile_run:
    name: Compile and run ${{ matrix.app_parameter.name_pretty }} on ${{ matrix.config.os_name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              os_name: ubuntu-latest,
              archive_name: linux-products
          }
          - {
              os_name: windows-latest,
              archive_name: windows-products
          }
          - {
              os_name: macos-13,
              archive_name: mac-x86-products
          }
          - {
              os_name: macos-latest,
              archive_name: mac-aarch64-products
          }

        app_parameter:
          - {
            app_name: org.ietr.preesm.sobel-morpho,
            scenario_name: 4core.scenario,
            workflow_name: Codegen.workflow,
            iteration: 300,
            name_pretty: Sobel Morpho
          }
          - {
            app_name: stereo/org.ietr.preesm.stereo,
            scenario_name: 4core.scenario,
            workflow_name: NEWSynthesisAPI_legacy.workflow,
            iteration: 1,
            name_pretty: Stereo Matching
          }
          - {
            app_name: SIFT,
            scenario_name: HextractSIFT4Corex86_64.scenario,
            workflow_name: Codegen.workflow,
            iteration: 1,
            name_pretty: SIFT
          }
          - {
            app_name: org.ietr.preesm.stabilization,
            scenario_name: 4coreX86.scenario,
            workflow_name: Codegen.workflow,
            iteration: 375,
            name_pretty: Video Stabilisation
          }
    runs-on: ${{ matrix.config.os_name }}
    steps:

      - name: Install dependencies
        shell: bash
        run: |
              if [ "$RUNNER_OS" == "Linux" ]; then
                sudo apt update && sudo apt install -y libsdl2-dev libsdl2-ttf-dev
              elif [ "$RUNNER_OS" == "macOS" ]; then
                brew install sdl2 sdl2_ttf
              fi

      - name: Pull preesm-apps
        uses: actions/checkout@v5
        with:
          repository: preesm/preesm-apps

      - name: Get Preesm from artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.config.archive_name }}

      - name: Extract Preesm
        shell: bash
        run: unzip preesm-*.zip -d preesm

      - name: Compile, run and test ${{ matrix.app_parameter.name_pretty }}
        shell: bash
        run: bash .run_ci.sh -p preesm/ -a ${{ matrix.app_parameter.app_name }} -w ${{ matrix.app_parameter.workflow_name }} -s ${{ matrix.app_parameter.scenario_name }} -i ${{ matrix.app_parameter.iteration }}

  deploy:
    # `if` required because a workflow run is triggered regardless of
    # the result of the previous workflow (see the documentation page)
    if: github.ref == 'refs/heads/develop' && github.event.schedule != '0 7 * * MON'
    name: GihHub Release
    needs: [build, compile_run]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-products

      - name: Download Mac aarch64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: mac-aarch64-products

      - name: Download Mac x86 artifacts
        uses: actions/download-artifact@v5
        with:
          name: mac-x86-products

      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-products

      - name: Download changelog
        uses: actions/download-artifact@v5
        with:
          name: changelog

      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=DevBuild_$(date +"%Y.%m.%d_%H-%M")" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          tag_name: ${{ steps.tag.outputs.release_tag }}
          #body: Check commit history for detailled changes.
          body_path: dev-changelog.txt
          files: |
            preesm-*-linux.gtk.x86_64.zip
            preesm-*-macosx.cocoa.aarch64.zip
            preesm-*-macosx.cocoa.x86_64.zip
            preesm-*-win32.win32.x86_64.zip
